# Trading System Scripts Manager
# Usage: python3 run_script.py <category> <script_name>
# Or: python3 run_script.py list

scripts:
  # ============================================================================
  # DATA MANAGEMENT
  # ============================================================================
  data:
    description: "Data fetching and processing"
    fetch-spy:
      description: "Fetch SPY data (1d + 1h)"
      command: "python3 main.py fetch-data --tickers SPY"

    fetch-multi:
      description: "Fetch multiple tickers (SPY, QQQ, GLD, BTC)"
      command: "python3 main.py fetch-data --tickers SPY,QQQ,GLD,BTC-USD"

    fetch-all:
      description: "Fetch all configured tickers"
      command: "python3 main.py fetch-data"

    status:
      description: "Check system status and data"
      command: "python3 main.py status"

  # ============================================================================
  # MODEL TRAINING
  # ============================================================================
  train:
    description: "Train ML models"

    lstm-gld:
      description: "Train LSTM model for GLD (1d)"
      command: "python3 main.py train-lstm --ticker GLD --interval 1d --epochs 50"

    lstm-msft:
      description: "Train LSTM model for MSFT (1d)"
      command: "python3 main.py train-lstm --ticker MSFT --interval 1d --epochs 50"

    lstm-btc:
      description: "Train LSTM model for BTC-USD (1h)"
      command: "python3 main.py train-lstm --ticker BTC-USD --interval 1h --epochs 50"

    lstm-all:
      description: "Train LSTM models for all best performers"
      command: "python3 main.py train-lstm --ticker GLD --interval 1d --epochs 50 && python3 main.py train-lstm --ticker MSFT --interval 1d --epochs 50 && python3 main.py train-lstm --ticker QQQ --interval 1d --epochs 50"

    expansion:
      description: "Train expansion models (AAPL, NVDA, SPY, GDX, XLU, IWM)"
      command: "python3 train_intraday_expansion.py"

    ensemble:
      description: "Train ensemble (LSTM + XGBoost) for best performers"
      command: "python3 train_ensemble_models.py"

  # ============================================================================
  # SIGNAL GENERATION
  # ============================================================================
  signals:
    description: "Generate trading signals"

    signal-gld:
      description: "Generate signal for GLD"
      command: "python3 main.py signal --ticker GLD --interval 1d --strategy macd_vwap"

    signal-single:
      description: "Generate signal for single ticker"
      command: "python3 main.py signal --ticker GLD --interval 1d --use-ml"

    ensemble-basic:
      description: "Generate ensemble signals (LSTM + XGBoost)"
      command: "python3 live_signals_ensemble.py"

    ensemble-expanded:
      description: "Generate expanded ensemble signals (12 tickers)"
      command: "python3 live_signals_expanded.py"

    ensemble-specific:
      description: "Generate ensemble signals for specific tickers"
      command: "python3 live_signals_expanded.py --tickers GLD,MSFT,BTC-USD"

    scan:
      description: "Scan multiple tickers and strategies"
      command: "python3 main.py scan"

    watch:
      description: "Watch mode - continuous monitoring"
      command: "python3 main.py watch"

  # ============================================================================
  # BACKTESTING
  # ============================================================================
  backtest:
    description: "Backtest trading strategies"

    backtest-macd:
      description: "Backtest MACD+VWAP strategy on SPY 1d"
      command: "python3 main.py backtest --strategy macd_vwap --ticker SPY --interval 1d"

    backtest-rsi:
      description: "Backtest RSI+BB strategy on SPY 1d"
      command: "python3 main.py backtest --strategy rsi_bb --ticker SPY --interval 1d"

    backtest-ma:
      description: "Backtest MA Crossover strategy on SPY 1d"
      command: "python3 main.py backtest --strategy ma_crossover --ticker SPY --interval 1d"

    backtest-all:
      description: "Backtest all strategies on SPY"
      command: "python3 main.py backtest --ticker SPY --interval 1d"

  # ============================================================================
  # NEWS & SENTIMENT ANALYSIS
  # ============================================================================
  news:
    description: "News sentiment analysis and testing"

    test-gld:
      description: "Test news analysis for GLD BUY signal"
      command: "python3 test_news_integration.py --ticker GLD --direction BUY --confidence 0.72"

    test-msft:
      description: "Test news analysis for MSFT SELL signal"
      command: "python3 test_news_integration.py --ticker MSFT --direction SELL --confidence 0.68"

    test-btc:
      description: "Test news analysis for BTC-USD BUY signal"
      command: "python3 test_news_integration.py --ticker BTC-USD --direction BUY --confidence 0.65"

    test-multi:
      description: "Test news analysis for multiple signals"
      command: "python3 test_news_integration.py --multiple"

    test-custom:
      description: "Test custom signal (requires --ticker --direction --confidence)"
      command: "python3 test_news_integration.py --ticker {ticker} --direction {direction} --confidence {confidence}"

  # ============================================================================
  # TESTING & VALIDATION
  # ============================================================================
  test:
    description: "Run test suites"

    test-all:
      description: "Run all tests"
      command: "pytest tests/ -v"

    test-data:
      description: "Test data fetcher and processor"
      command: "pytest tests/test_data.py -v"

    test-indicators:
      description: "Test technical indicators"
      command: "pytest tests/test_indicators.py -v"

    test-strategies:
      description: "Test trading strategies"
      command: "pytest tests/test_strategies.py -v"

    test-backtesting:
      description: "Test backtesting engine"
      command: "pytest tests/test_backtesting.py -v"

    test-signals:
      description: "Test signal generator"
      command: "pytest tests/test_signals.py -v"

    test-coverage:
      description: "Run tests with coverage report"
      command: "pytest tests/ --cov=. --cov-report=html"

  # ============================================================================
  # DOCUMENTATION & ANALYSIS
  # ============================================================================
  docs:
    description: "Documentation and analysis"

    list-strategies:
      description: "List all available strategies"
      command: "python3 main.py list-strategies"

    show-config:
      description: "Show current configuration"
      command: "python3 main.py status"

    view-guide:
      description: "View setup guide (requires guide name)"
      command: "cat docs/guides/{guide_name}.md"

  # ============================================================================
  # QUICK WORKFLOWS
  # ============================================================================
  workflows:
    description: "Pre-configured workflows"

    daily-check:
      description: "Daily check: fetch data, generate signals, scan all"
      command: "python3 main.py fetch-data && python3 live_signals_expanded.py && python3 main.py scan"

    quick-signals:
      description: "Quick signal generation for top 3 tickers"
      command: "python3 live_signals_expanded.py --tickers GLD,MSFT,BTC-USD"

    full-backtest:
      description: "Full backtest suite on all strategies"
      command: "python3 main.py backtest --ticker SPY --interval 1d && python3 main.py backtest --ticker GLD --interval 1d"

    ml-update:
      description: "Update ML models: fetch data + train LSTM"
      command: "python3 main.py fetch-data && python3 train_intraday_expansion.py"

    full-test:
      description: "Full test suite: unit tests + backtests + signal generation"
      command: "pytest tests/ -v && python3 live_signals_expanded.py --tickers GLD,MSFT"

categories_help:
  - name: "data"
    description: "Fetch and manage market data"
    usage: "python3 run_script.py data fetch-all"

  - name: "train"
    description: "Train machine learning models (LSTM, XGBoost, Ensemble)"
    usage: "python3 run_script.py train lstm-gld"

  - name: "signals"
    description: "Generate trading signals (single, ensemble, scan, watch)"
    usage: "python3 run_script.py signals ensemble-expanded"

  - name: "backtest"
    description: "Backtest trading strategies"
    usage: "python3 run_script.py backtest backtest-macd"

  - name: "news"
    description: "Test news sentiment analysis"
    usage: "python3 run_script.py news test-gld"

  - name: "test"
    description: "Run unit tests and validation"
    usage: "python3 run_script.py test test-all"

  - name: "docs"
    description: "Documentation and configuration"
    usage: "python3 run_script.py docs list-strategies"

  - name: "workflows"
    description: "Pre-configured workflows combining multiple steps"
    usage: "python3 run_script.py workflows daily-check"

help_text: |
  === Trading System Script Manager ===

  Usage:
    python3 run_script.py <category> <script_name> [options]
    python3 run_script.py list                           # Show all scripts
    python3 run_script.py list <category>                # Show category scripts
    python3 run_script.py help                           # Show this help

  Examples:
    python3 run_script.py data fetch-all
    python3 run_script.py signals ensemble-expanded
    python3 run_script.py train lstm-gld
    python3 run_script.py test test-all
    python3 run_script.py news test-multi
    python3 run_script.py workflows daily-check

  Quick Start:
    1. Fetch data:       python3 run_script.py data fetch-all
    2. Train models:     python3 run_script.py train lstm-all
    3. Generate signals: python3 run_script.py signals ensemble-expanded
    4. Run tests:        python3 run_script.py test test-all

  Categories:
    - data        : Fetch and manage data
    - train       : Train ML models
    - signals     : Generate trading signals
    - backtest    : Backtest strategies
    - news        : Test news sentiment analysis
    - test        : Run test suites
    - docs        : Documentation
    - workflows   : Pre-configured workflows
