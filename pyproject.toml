[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-trading-system"
version = "0.1.0"
description = "Sistema hibrido de trading tecnico para CFDs (analisis tecnico + ML)"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.2",
    "pandas-ta==0.4.71b0",
    "vectorbt>=0.28.0,<1.0.0",
    "xgboost==3.3.0",
    "alpaca-py==0.43.5",
    "yfinance==1.1.0",
    "ccxt==4.5.37",
    "numba==0.61.2",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "plotly==5.18.0",
    "requests==2.34.2",
    "httpx>=0.28.0",
    "click==8.1.7",
    "python-dotenv==1.2.2",
    "pytest==7.4.4",
]

[project.optional-dependencies]
timesfm = ["timesfm[torch]"]
tensorflow = ["tensorflow==2.21.0"]
kronos = []

[project.scripts]
cfd-trade = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = [
    "backtesting*",
    "config*",
    "data*",
    "indicators*",
    "models*",
    "signals*",
    "strategies*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
